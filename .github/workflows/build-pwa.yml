name: Build standalone PWA ZIP
on:
  push:
    branches: [main, maintenance/v60-code-quality]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
# Only the newest source revision should build or deploy.
concurrency:
  group: helioclock-chatgpt-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  change-scope:
    runs-on: ubuntu-24.04
    outputs:
      full_build: ${{ steps.scope.outputs.full_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether application files changed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            # A later docs-only push may cancel an earlier application build.
            # Always build main pushes so the latest source revision deploys.
            echo "Full build for push/dispatch (prevents cancelled release)"
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit unavailable: running the full suite"
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          echo "$changed"
          # Only README and Markdown documentation are safe to skip.
          # Workflow, script, configuration, assets and source changes always run full CI.
          if [[ -n "$changed" ]] && ! grep -Ev '(^README\.md$|^docs/.*\.md$|^.*\.md$)' <<< "$changed" | grep -q .; then
            echo "Markdown-only change: skipping PWA build and browser tests"
            echo "full_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "full_build=true" >> "$GITHUB_OUTPUT"
          fi
  quick-check:
    needs: change-scope
    if: needs.change-scope.outputs.full_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify curated release history matches README and version
        run: npm run docs:check
      - name: Syntax checks
        run: |
          for file in astronomy.js app.js solar-chart.js moon-renderer.js sky-atlas.js milky-way.js sky-projection.js ecliptic.js almanac.js eclipse-events.js eclipse-geometry.js eclipse-earth-shadow.js earth-renderer.js earth-admin1-data.js earth-gazetteer.js earth-cities-data.js earth-nearest-settlement.js solar-eclipse-renderer.js; do
            node --check "$file"
          done
          node --check sw.js
          node --check comet-catalog.js
          node --check comet-orbits.js
          node --check minor-body-geometry.js
          node --check asteroid-orbits.js
          node --check scripts/update-major-asteroids.mjs
          node --check horizons-validation.js
          node --check scripts/verify-halley-horizons.mjs
          node --check scripts/update-comets.mjs
          node --check sky-moon-phase.js
          node --check tests/firefox.spec.mjs
          python3 -m py_compile scripts/build-milky-way.py scripts/build-sky-data.py
      - name: Astronomy unit checks
        run: npx esbuild tests/astronomy.test.mjs --bundle --platform=node --format=esm --outfile=/tmp/helioclock-astronomy-test.mjs && node /tmp/helioclock-astronomy-test.mjs
      - name: Eclipse geometry and event regression checks
        run: |
          for test in eclipse-events eclipse-geometry eclipse-earth-shadow; do
            npx esbuild "tests/${test}.test.mjs" --bundle --platform=node --format=esm --outfile="/tmp/helioclock-${test}-test.mjs"
            node "/tmp/helioclock-${test}-test.mjs"
          done
      - name: Offline political geography unit checks
        run: |
          npx esbuild tests/earth-political.test.mjs --bundle --platform=node --format=esm --outfile=/tmp/helioclock-earth-political-test.mjs
          node /tmp/helioclock-earth-political-test.mjs
      - name: Nearest settlement unit checks
        run: |
          npx esbuild tests/earth-nearest-settlement.test.mjs --bundle --platform=node --format=esm --outfile=/tmp/helioclock-nearest-settlement-test.mjs
          node /tmp/helioclock-nearest-settlement-test.mjs
      - name: Local Sun Map bearings and illumination unit regression
        run: node --test tests/local-sun-geometry.test.mjs
      - name: ISS OMM and SGP4 propagation regression
        run: node --test tests/iss-tracking.test.mjs
      - name: ISS sky and pass-finding regression
        run: node --test tests/iss-sky.test.mjs
      - name: MPC comet catalogue parser regression
        run: node --test tests/comet-catalog.test.mjs
      - name: Comet orbital position and finder regression
        run: npx esbuild tests/comet-orbits.test.mjs --bundle --platform=node --format=esm --outfile=/tmp/helioclock-comet-orbits-test.mjs && node /tmp/helioclock-comet-orbits-test.mjs
      - name: JPL Horizons XYZ comparison parser regression
        run: node tests/horizons-validation.test.mjs
      - name: Asteroid orbital unit regression
        run: npx esbuild tests/asteroids.test.mjs --bundle --platform=node --format=esm --outfile=/tmp/helioclock-asteroids-test.mjs && node /tmp/helioclock-asteroids-test.mjs
      - name: Minor-body orbital geometry unit checks
        run: node tests/minor-body-geometry.test.mjs
      - name: Lunar sky marker regression
        run: node --test tests/sky-moon-phase.test.mjs
      - name: Bundle application
        run: npm run build
  package:
    needs: [change-scope, quick-check]
    if: needs.change-scope.outputs.full_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle independent visualizations
        run: npm run build
      # Static astronomy imagery and catalogues are immutable within a
      # cache revision. Bump v1 when intentionally refreshing source data.
      - name: Restore static astronomy data cache
        uses: actions/cache@v4
        with:
          path: /tmp/helioclock-cache
          key: helioclock-astronomy-assets-v1
      - name: Stage cached assets
        shell: bash
        run: |
          mkdir -p /tmp/helioclock-cache dist /tmp/helioclock-atlas
          for file in earth-blue-marble.png moon-nearside-lro.jpg; do
            if [ -s "/tmp/helioclock-cache/$file" ]; then
              cp "/tmp/helioclock-cache/$file" "dist/$file"
            fi
          done
          for file in stars.8.json constellations.lines.json starnames.json mw.json; do
            if [ -s "/tmp/helioclock-cache/$file" ]; then
              cp "/tmp/helioclock-cache/$file" "/tmp/helioclock-atlas/$file"
            fi
          done
      - name: Bundle NASA Blue Marble satellite texture
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "dist/earth-blue-marble.png" ]; then
            curl --fail --location --retry 3 --max-time 90 --silent --show-error \
              https://svs.gsfc.nasa.gov/vis/a000000/a002900/a002915/bluemarble-2048.png \
              --output dist/earth-blue-marble.png
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/earth-blue-marble.png')
          assert p.stat().st_size > 100000, 'Satellite Earth texture is missing or too small'
          assert p.read_bytes()[:8] == bytes.fromhex('89504e470d0a1a0a'), 'Invalid PNG texture'
          print('Satellite texture validated:',p.stat().st_size,'bytes')
          PY
      # Bundle a genuine NASA-derived 4096x2048 Earth mosaic, not an
      # upscaled copy of the default 2K texture. Cache independently of
      # the legacy static astronomy cache, which may already be immutable.
      - name: Restore 4K Blue Marble texture
        uses: actions/cache/restore@v4
        with:
          path: /tmp/helioclock-earth-4k.jpg
          key: helioclock-earth-4k-nasa-july-v1
      - name: Bundle offline 4K Earth texture
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/helioclock-earth-4k.jpg ]; then
            cp /tmp/helioclock-earth-4k.jpg dist/earth-blue-marble-4k.jpg
          else
            curl --fail --location --retry 3 --max-time 120 --silent --show-error \
              https://raw.githubusercontent.com/MaxwellLee/physics-lab/main/assets/textures/earth_4096.jpg \
              --output dist/earth-blue-marble-4k.jpg
            cp dist/earth-blue-marble-4k.jpg /tmp/helioclock-earth-4k.jpg
          fi
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          p=Path('dist/earth-blue-marble-4k.jpg')
          raw=p.read_bytes()
          assert len(raw)>100000 and raw[:2]==bytes.fromhex('ffd8'), 'Missing high resolution JPEG texture'
          # Read JPEG SOF dimensions without installing imaging dependencies.
          i=2
          dims=None
          while i<len(raw)-10:
              if raw[i]!=0xff:
                  i+=1
                  continue
              marker=raw[i+1]
              if marker in (0xd8,0xd9) or 0xd0<=marker<=0xd7:
                  i+=2;continue
              length=unpack('>H',raw[i+2:i+4])[0]
              if marker in (0xc0,0xc1,0xc2,0xc3):
                  dims=unpack('>HH',raw[i+5:i+9]);break
              i+=2+length
          assert dims==(2048,4096),f'Unexpected 4K texture dimensions: {dims}'
          print('4K NASA-derived Earth texture verified:',dims,len(raw),'bytes')
          PY
      - name: Save 4K texture for future offline builds
        uses: actions/cache/save@v4
        with:
          path: /tmp/helioclock-earth-4k.jpg
          key: helioclock-earth-4k-nasa-july-v1
      - name: Bundle NASA lunar near-side mosaic
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "dist/moon-nearside-lro.jpg" ]; then
            curl --fail --location --retry 3 --max-time 90 --silent --show-error \
              https://upload.wikimedia.org/wikipedia/commons/c/c9/Moon_nearside_LRO.jpg \
              --output dist/moon-nearside-lro.jpg
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/moon-nearside-lro.jpg')
          assert p.stat().st_size > 100000, 'Lunar photo is missing'
          assert p.read_bytes()[:2] == bytes.fromhex('ffd8'), 'Invalid JPEG lunar mosaic'
          print('LRO lunar photo:',p.stat().st_size,'bytes')
          PY
      # Offline global LROC surface imagery for the rotatable lunar globe.
      # A real 360-degree map, rather than reusing the near-side image.
      - name: Restore NASA global lunar texture
        uses: actions/cache/restore@v4
        with:
          path: /tmp/helioclock-lroc-global-2k.jpg
          key: helioclock-lroc-global-2k-nasa-svs-v1
      - name: Package verified NASA CGI Moon Kit global map
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/helioclock-lroc-global-2k.jpg ]; then
            cp /tmp/helioclock-lroc-global-2k.jpg dist/lroc-global-2k.jpg
          else
            curl --fail --location --retry 3 --max-time 90 --silent --show-error \
              https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/lroc_color_2k.jpg \
              --output dist/lroc-global-2k.jpg
            cp dist/lroc-global-2k.jpg /tmp/helioclock-lroc-global-2k.jpg
          fi
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          p=Path('dist/lroc-global-2k.jpg')
          data=p.read_bytes()
          assert len(data)>100000 and data[:2]==bytes.fromhex('ffd8'), 'Global LROC JPEG missing'
          i=2
          dims=None
          while i<len(data)-10:
              if data[i]!=0xff:
                  i+=1;continue
              marker=data[i+1]
              if marker in (0xd8,0xd9) or 0xd0<=marker<=0xd7:
                  i+=2;continue
              length=unpack('>H',data[i+2:i+4])[0]
              if marker in (0xc0,0xc1,0xc2,0xc3):
                  dims=unpack('>HH',data[i+5:i+9]);break
              i+=2+length
          assert dims==(1024,2048),f'Unexpected LROC global map dimensions: {dims}'
          print('NASA 360-degree lunar texture verified:',len(data),'bytes')
          PY
      - name: Save global LROC texture for later offline builds
        uses: actions/cache/save@v4
        with:
          path: /tmp/helioclock-lroc-global-2k.jpg
          key: helioclock-lroc-global-2k-nasa-svs-v1
      # Keep a previously validated solar photograph available when NASA's
      # realtime image endpoint temporarily refuses connections.
      - name: Restore cached offline solar reference
        uses: actions/cache/restore@v4
        with:
          path: /tmp/helioclock-solar-fallback.jpg
          key: helioclock-solar-fallback-v1
      - name: Bundle fallback NASA SDO solar continuum image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/helioclock-solar-fallback.jpg ]; then
            cp /tmp/helioclock-solar-fallback.jpg dist/solar-fallback.jpg
          else
            # Solar observations are optional online data: do not make a
            # temporary NASA outage break the offline PWA release.
            if ! curl --fail --location --retry 2 --retry-delay 2 --max-time 25 --silent --show-error \
              https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIIC.jpg \
              --output dist/solar-fallback.jpg; then
              echo "NASA SDO image unreachable; restoring last verified offline reference from the successful v35 build"
              curl --fail --location --retry 2 --max-time 40 --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13710680763/zip" \
                --output /tmp/helioclock-last-good.zip
              unzip -p /tmp/helioclock-last-good.zip solar-fallback.jpg > dist/solar-fallback.jpg
            fi
            cp dist/solar-fallback.jpg /tmp/helioclock-solar-fallback.jpg
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/solar-fallback.jpg')
          assert p.stat().st_size > 50000, 'NASA solar reference is missing or too small'
          assert p.read_bytes()[:2] == bytes.fromhex('ffd8'), 'Invalid JPEG solar reference'
          print('Offline NASA SDO solar reference:',p.stat().st_size,'bytes')
          PY
      - name: Save offline solar fallback for later builds
        uses: actions/cache/save@v4
        with:
          path: /tmp/helioclock-solar-fallback.jpg
          key: helioclock-solar-fallback-v1
      - name: Bundle offline star catalogue and constellation stick figures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/helioclock-atlas
          if [ ! -s "/tmp/helioclock-atlas/stars.8.json" ]; then
            curl --fail --location --retry 3 --max-time 120 --silent --show-error \
              https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/stars.8.json \
              --output /tmp/helioclock-atlas/stars.8.json
          fi
          if [ ! -s "/tmp/helioclock-atlas/constellations.lines.json" ]; then
            curl --fail --location --retry 3 --max-time 120 --silent --show-error \
              https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/constellations.lines.json \
              --output /tmp/helioclock-atlas/constellations.lines.json
          fi
          if [ ! -s "/tmp/helioclock-atlas/starnames.json" ]; then
            curl --fail --location --retry 3 --max-time 120 --silent --show-error \
              https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/starnames.json \
              --output /tmp/helioclock-atlas/starnames.json
          fi
          python3 scripts/build-sky-data.py /tmp/helioclock-atlas dist
      - name: Bundle published Milky Way brightness outlines
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "/tmp/helioclock-atlas/mw.json" ]; then
            curl --fail --location --retry 3 --max-time 90 --silent --show-error \
              https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/mw.json \
              --output /tmp/helioclock-atlas/mw.json
          fi
          python3 scripts/build-milky-way.py /tmp/helioclock-atlas/mw.json dist/sky-milkyway.json
      - name: Update static astronomy cache for future builds
        shell: bash
        run: |
          mkdir -p /tmp/helioclock-cache
          cp dist/earth-blue-marble.png dist/moon-nearside-lro.jpg /tmp/helioclock-cache/
          cp /tmp/helioclock-atlas/{stars.8.json,constellations.lines.json,starnames.json,mw.json} /tmp/helioclock-cache/
      - name: Bundle NASA Black Marble 2016 night lights
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --max-time 120 --silent --show-error \
            https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144897/BlackMarble_2016_01deg_gray.jpg \
            --output dist/earth-black-marble-lights-2016.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/earth-black-marble-lights-2016.jpg')
          assert p.stat().st_size>50000 and p.read_bytes()[:2]==bytes.fromhex('ffd8'), 'Black Marble JPEG missing'
          print('Bundled NASA Black Marble:',p.stat().st_size)
          PY
      # Retain the last valid MPC snapshot for builds without MPC access.
      - name: Restore last successful comet catalogue
        uses: actions/cache/restore@v4
        with:
          path: /tmp/helioclock-comets.json
          key: helioclock-mpc-comets-v1-${{ github.run_id }}
          restore-keys: |
            helioclock-mpc-comets-v1-
      - name: Refresh MPC CometEls catalogue for offline distribution
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-comets.mjs --output dist/comets.json --fallback /tmp/helioclock-comets.json
          node -e "const c=require('./dist/comets.json');if(!Array.isArray(c.records)||c.count!==c.records.length)process.exit(1);console.log('MPC comet snapshot',c.status,c.count)"
          if node -e "process.exit(require('./dist/comets.json').status==='ready'?0:1)"; then
            cp dist/comets.json /tmp/helioclock-comets.json
            echo "COMET_REFRESHED=true" >> "$GITHUB_ENV"
          fi
      - name: Save current MPC comet catalogue cache
        if: env.COMET_REFRESHED == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/helioclock-comets.json
          key: helioclock-mpc-comets-v1-${{ github.run_id }}
      - name: Compare Halley at 1986, 2026 and 2061 with JPL Horizons
        run: node scripts/verify-halley-horizons.mjs dist/comets.json dist/halley-validation.json
      - name: Package latest CelesTrak ISS elements for offline use
        run: node scripts/update-iss.mjs dist/iss-elements.json
      - name: Package JPL major asteroid elements
        run: node scripts/update-major-asteroids.mjs dist/major-asteroids.json
      - name: Stage static files for browser test
        run: cp index.html styles.css astronomy.js manifest.webmanifest sw.js icon.svg hero-landscape-natural.webp dist/ && ver="$(node -p 'require("./package.json").version.split(".")[0]')" && printf '{"version":%s,"test":true,"commit":"%s","built_utc":"%s"}\n' "$ver" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
      - name: Stamp cache identity for browser tests
        run: node scripts/stamp-sw.mjs
      # Pin a stable runner and download only the Playwright browser binary.
      # Avoid apt-based --with-deps: the Ubuntu archive DNS endpoint can
      # intermittently fail and strand the job for 20+ minutes.
      - name: Install Firefox for browser checks
        timeout-minutes: 5
        run: npx playwright install firefox
      - name: Smoke-test fullscreen navigation in Firefox
        run: npx playwright test --grep 'Fullscreen panel navigation|Fullscreen arrow keys'
      - name: Exercise browser controls in Firefox
        run: npm run test:browser
      - name: Install Chromium for Pixel mobile checks
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Exercise Pixel-size Chromium touch and fullscreen controls
        run: npx playwright test --config=playwright.mobile.config.mjs
      - name: Assemble standalone distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css astronomy.js manifest.webmanifest sw.js icon.svg hero-landscape-natural.webp dist/
          ver="$(node -p 'require("./package.json").version.split(".")[0]')"
          printf '{"version":%s,"commit":"%s","built_utc":"%s","repository":"%s"}\n' "$ver" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REPOSITORY" > dist/build-info.json
          node -e "const a=require('./dist/build-info.json');const b=require('./package.json');if(a.version!==parseInt(b.version,10))process.exit(1)"
          node scripts/stamp-sw.mjs
          grep -q "helioclock-chatgpt-v${ver}-" dist/sw.js
      - name: Upload PWA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HelioClock-ChatGPT-PWA
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Deploy tested assets to Cloudflare Pages
        # Manual workflow_dispatch runs are ZIP-only, even when started on main.
        # Only a push to main may publish to Cloudflare Pages.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare Pages deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 0
          fi
          # Never let a slower, obsolete workflow replace the newest live release.
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$latest_sha" ]; then
            echo "::error::Could not verify current main branch revision; deployment blocked."
            exit 1
          fi
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping stale deployment: a newer revision exists on main."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name=helioclock-chatgpt --branch=main
