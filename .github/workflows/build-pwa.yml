name: Build standalone PWA ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and astronomy
        shell: bash
        run: |
          node --check --experimental-default-type=module astronomy.js
          node --check --experimental-default-type=module app.js
          node --check sw.js
          node --experimental-default-type=module tests/astronomy.test.mjs
      - name: Assemble standalone distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css astronomy.js app.js manifest.webmanifest sw.js icon.svg dist/
          printf '{"commit":"%s","built_utc":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REPOSITORY" > dist/build-info.json
          cd dist
          zip -q -r ../HelioClock-ChatGPT-PWA.zip .
      - name: Upload PWA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HelioClock-ChatGPT-PWA
          path: HelioClock-ChatGPT-PWA.zip
          retention-days: 30
