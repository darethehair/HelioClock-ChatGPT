name: Build standalone PWA ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# Only the newest source revision should build or deploy.
concurrency:
  group: helioclock-chatgpt-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: |
          for file in astronomy.js app.js solar-chart.js moon-renderer.js sky-atlas.js milky-way.js sky-projection.js ecliptic.js almanac.js; do
            node --check "$file"
          done
          node --check sw.js
          node --check tests/firefox.spec.mjs
          python3 -m py_compile scripts/build-milky-way.py scripts/build-sky-data.py
      - name: Astronomy unit checks
        run: npx esbuild tests/astronomy.test.mjs --bundle --platform=node --format=esm --outfile=/tmp/helioclock-astronomy-test.mjs && node /tmp/helioclock-astronomy-test.mjs
      - name: Bundle application
        run: npm run build
  package:
    needs: quick-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle independent visualizations
        run: npm run build
      # Static astronomy imagery and catalogues are immutable within a
      # cache revision. Bump v1 when intentionally refreshing source data.
      - name: Restore static astronomy data cache
        uses: actions/cache@v4
        with:
          path: /tmp/helioclock-cache
          key: helioclock-astronomy-assets-v1
      - name: Stage cached assets
        shell: bash
        run: |
          mkdir -p /tmp/helioclock-cache dist /tmp/helioclock-atlas
          for file in earth-blue-marble.png moon-nearside-lro.jpg; do
            if [ -s "/tmp/helioclock-cache/$file" ]; then
              cp "/tmp/helioclock-cache/$file" "dist/$file"
            fi
          done
          for file in stars.8.json constellations.lines.json starnames.json mw.json; do
            if [ -s "/tmp/helioclock-cache/$file" ]; then
              cp "/tmp/helioclock-cache/$file" "/tmp/helioclock-atlas/$file"
            fi
          done
      - name: Bundle NASA Blue Marble satellite texture
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "dist/earth-blue-marble.png" ]; then
            curl --fail --location --retry 3 --max-time 90 --silent --show-error \
              https://svs.gsfc.nasa.gov/vis/a000000/a002900/a002915/bluemarble-2048.png \
              --output dist/earth-blue-marble.png
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/earth-blue-marble.png')
          assert p.stat().st_size > 100000, 'Satellite Earth texture is missing or too small'
          assert p.read_bytes()[:8] == bytes.fromhex('89504e470d0a1a0a'), 'Invalid PNG texture'
          print('Satellite texture validated:',p.stat().st_size,'bytes')
          PY
      # Bundle a genuine NASA-derived 4096x2048 Earth mosaic, not an
      # upscaled copy of the default 2K texture. Cache independently of
      # the legacy static astronomy cache, which may already be immutable.
      - name: Restore 4K Blue Marble texture
        uses: actions/cache/restore@v4
        with:
          path: /tmp/helioclock-earth-4k.jpg
          key: helioclock-earth-4k-nasa-july-v1
      - name: Bundle offline 4K Earth texture
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/helioclock-earth-4k.jpg ]; then
            cp /tmp/helioclock-earth-4k.jpg dist/earth-blue-marble-4k.jpg
          else
            curl --fail --location --retry 3 --max-time 120 --silent --show-error \
              https://raw.githubusercontent.com/MaxwellLee/physics-lab/main/assets/textures/earth_4096.jpg \
              --output dist/earth-blue-marble-4k.jpg
            cp dist/earth-blue-marble-4k.jpg /tmp/helioclock-earth-4k.jpg
          fi
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          p=Path('dist/earth-blue-marble-4k.jpg')
          raw=p.read_bytes()
          assert len(raw)>100000 and raw[:2]==bytes.fromhex('ffd8'), 'Missing high resolution JPEG texture'
          # Read JPEG SOF dimensions without installing imaging dependencies.
          i=2
          dims=None
          while i<len(raw)-10:
              if raw[i]!=0xff:
                  i+=1
                  continue
              marker=raw[i+1]
              if marker in (0xd8,0xd9) or 0xd0<=marker<=0xd7:
                  i+=2;continue
              length=unpack('>H',raw[i+2:i+4])[0]
              if marker in (0xc0,0xc1,0xc2,0xc3):
                  dims=unpack('>HH',raw[i+5:i+9]);break
              i+=2+length
          assert dims==(2048,4096),f'Unexpected 4K texture dimensions: {dims}'
          print('4K NASA-derived Earth texture verified:',dims,len(raw),'bytes')
          PY
      - name: Save 4K texture for future offline builds
        uses: actions/cache/save@v4
        with:
          path: /tmp/helioclock-earth-4k.jpg
          key: helioclock-earth-4k-nasa-july-v1
      - name: Bundle NASA lunar near-side mosaic
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "dist/moon-nearside-lro.jpg" ]; then
            curl --fail --location --retry 3 --max-time 90 --silent --show-error \
              https://upload.wikimedia.org/wikipedia/commons/c/c9/Moon_nearside_LRO.jpg \
              --output dist/moon-nearside-lro.jpg
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/moon-nearside-lro.jpg')
          assert p.stat().st_size > 100000, 'Lunar photo is missing'
          assert p.read_bytes()[:2] == bytes.fromhex('ffd8'), 'Invalid JPEG lunar mosaic'
          print('LRO lunar photo:',p.stat().st_size,'bytes')
          PY
      # Keep a previously validated solar photograph available when NASA's
      # realtime image endpoint temporarily refuses connections.
      - name: Restore cached offline solar reference
        uses: actions/cache/restore@v4
        with:
          path: /tmp/helioclock-solar-fallback.jpg
          key: helioclock-solar-fallback-v1
      - name: Bundle fallback NASA SDO solar continuum image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/helioclock-solar-fallback.jpg ]; then
            cp /tmp/helioclock-solar-fallback.jpg dist/solar-fallback.jpg
          else
            # Solar observations are optional online data: do not make a
            # temporary NASA outage break the offline PWA release.
            if ! curl --fail --location --retry 2 --retry-delay 2 --max-time 25 --silent --show-error \
              https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_HMIIC.jpg \
              --output dist/solar-fallback.jpg; then
              echo "NASA SDO image unreachable; restoring last verified offline reference from the successful v35 build"
              curl --fail --location --retry 2 --max-time 40 --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13710680763/zip" \
                --output /tmp/helioclock-last-good.zip
              unzip -p /tmp/helioclock-last-good.zip solar-fallback.jpg > dist/solar-fallback.jpg
            fi
            cp dist/solar-fallback.jpg /tmp/helioclock-solar-fallback.jpg
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/solar-fallback.jpg')
          assert p.stat().st_size > 50000, 'NASA solar reference is missing or too small'
          assert p.read_bytes()[:2] == bytes.fromhex('ffd8'), 'Invalid JPEG solar reference'
          print('Offline NASA SDO solar reference:',p.stat().st_size,'bytes')
          PY
      - name: Save offline solar fallback for later builds
        uses: actions/cache/save@v4
        with:
          path: /tmp/helioclock-solar-fallback.jpg
          key: helioclock-solar-fallback-v1
      - name: Bundle offline star catalogue and constellation stick figures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/helioclock-atlas
          if [ ! -s "/tmp/helioclock-atlas/stars.8.json" ]; then
            curl --fail --location --retry 3 --max-time 120 --silent --show-error \
              https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/stars.8.json \
              --output /tmp/helioclock-atlas/stars.8.json
          fi
          if [ ! -s "/tmp/helioclock-atlas/constellations.lines.json" ]; then
            curl --fail --location --retry 3 --max-time 120 --silent --show-error \
              https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/constellations.lines.json \
              --output /tmp/helioclock-atlas/constellations.lines.json
          fi
          if [ ! -s "/tmp/helioclock-atlas/starnames.json" ]; then
            curl --fail --location --retry 3 --max-time 120 --silent --show-error \
              https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/starnames.json \
              --output /tmp/helioclock-atlas/starnames.json
          fi
          python3 scripts/build-sky-data.py /tmp/helioclock-atlas dist
      - name: Bundle published Milky Way brightness outlines
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "/tmp/helioclock-atlas/mw.json" ]; then
            curl --fail --location --retry 3 --max-time 90 --silent --show-error \
              https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/mw.json \
              --output /tmp/helioclock-atlas/mw.json
          fi
          python3 scripts/build-milky-way.py /tmp/helioclock-atlas/mw.json dist/sky-milkyway.json
      - name: Update static astronomy cache for future builds
        shell: bash
        run: |
          mkdir -p /tmp/helioclock-cache
          cp dist/earth-blue-marble.png dist/moon-nearside-lro.jpg /tmp/helioclock-cache/
          cp /tmp/helioclock-atlas/{stars.8.json,constellations.lines.json,starnames.json,mw.json} /tmp/helioclock-cache/
      - name: Bundle NASA Black Marble 2016 night lights
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --max-time 120 --silent --show-error \
            https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144897/BlackMarble_2016_01deg_gray.jpg \
            --output dist/earth-black-marble-lights-2016.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/earth-black-marble-lights-2016.jpg')
          assert p.stat().st_size>50000 and p.read_bytes()[:2]==bytes.fromhex('ffd8'), 'Black Marble JPEG missing'
          print('Bundled NASA Black Marble:',p.stat().st_size)
          PY
      - name: Stage static files for browser test
        run: cp index.html styles.css astronomy.js manifest.webmanifest sw.js icon.svg hero-landscape-natural.webp dist/ && printf '{"version":53,"test":true,"commit":"%s","built_utc":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
      # Pin a stable runner and download only the Playwright browser binary.
      # Avoid apt-based --with-deps: the Ubuntu archive DNS endpoint can
      # intermittently fail and strand the job for 20+ minutes.
      - name: Install Firefox for browser checks
        timeout-minutes: 5
        run: npx playwright install firefox
      - name: Exercise browser controls in Firefox
        run: npm run test:browser
      - name: Assemble standalone distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css astronomy.js manifest.webmanifest sw.js icon.svg hero-landscape-natural.webp dist/
          printf '{"version":51,"commit":"%s","built_utc":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REPOSITORY" > dist/build-info.json
      - name: Upload PWA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HelioClock-ChatGPT-PWA
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Deploy tested assets to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare Pages deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 0
          fi
          # Never let a slower, obsolete workflow replace the newest live release.
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$latest_sha" ]; then
            echo "::error::Could not verify current main branch revision; deployment blocked."
            exit 1
          fi
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping stale deployment: a newer revision exists on main."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name=helioclock-chatgpt --branch=main
